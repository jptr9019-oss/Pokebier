    <meta charset="UTF-8">

    <style>
        body {
    background-image: url("Pokebier/public/assets/imagens/flower_cliffs.png");

}

            position: fixed;

            width: 100vw;
            height: 100vh;
            background-color: white;

</head>

<body>

    <div id="tela-inicial">
        <button id="botao_porta">
            <img
                src="Pokebier/public/assets/imagens/realistic_door.png"
                alt="Abrir a porta"
            >
        </button>
    </div>

    <!-- Música de fundo -->
    <audio
        id="flowery_theme"
        src="Pokebier/public/assets/imagens/flowery_theme.mp3"
        loop>
    </audio>

    <!-- Imagem ou GIF do Flowery -->
    <img
        id="flowery"
        src="Pokebier/public/assets/imagens/flowery_horse.png"
        alt="Flowery"
    >

    <!-- Caixa de diálogo: preencher quando adicionar diálogos -->
    <img id="caixa-dialogo" src="" alt="Caixa de diálogo">

    <!-- Botão para avançar os diálogos -->
    <button id="btn-avancar">Avançar</button>

    <!-- Botão para continuar para a próxima página -->
    <a id="vamos_la" href="I_LOVE_TV_portas_do_amor.html">
        Vamos lá!
    </a>

    <script>
        const telaInicial = document.getElementById("tela-inicial");
        const botaoPorta = document.getElementById("botao_porta");
        const floweryTheme = document.getElementById("flowery_theme");

        const flowery = document.getElementById("flowery");
        const caixaDialogo = document.getElementById("caixa-dialogo");
        const btnAvancar = document.getElementById("btn-avancar");
        const vamosLa = document.getElementById("vamos_la");

        // Áudio individual dos diálogos, para uso futuro
        const audio = new Audio();

        // Adicione os diálogos do Flowery aqui futuramente
        const dialogos = [
            /*
            Exemplo de estrutura para adicionar depois:

            {
                flowery_sprite: "gif_folder/flowery_dancing.gif",
                png: "flowery_dialogue_folder/dialogo1.png",
                audio: "audio_folder/dialogo1.ogg",
                volumeBoost: 1.0
            }
            */
        ];

        let indiceDialogo = 0;

        function mostrarDialogo(indice) {
            const dialogo = dialogos[indice];

            if (!dialogo) return;

            if (dialogo.flowery_sprite) {
                flowery.src = dialogo.flowery_sprite;
            }

            if (dialogo.png) {
                caixaDialogo.src = dialogo.png;
            }

            flowery.style.display = "block";
            caixaDialogo.style.display = "block";
            btnAvancar.style.display = "block";

            if (dialogo.audio) {
                audio.pause();
                audio.src = dialogo.audio;
                audio.volume = 1.0;

                audio.play().catch(err => {
                    console.error("Erro ao tocar áudio do diálogo:", err);
                });
            }
        }

        botaoPorta.addEventListener("click", async () => {
            telaInicial.style.display = "none";
            flowery.style.display = "block";

            try {
                await floweryTheme.play();
            } catch (err) {
                console.error("Erro ao tocar a música de fundo:", err);
            }

            if (dialogos.length > 0) {
                mostrarDialogo(indiceDialogo);
            } else {
                vamosLa.style.display = "block";
            }
        });

        btnAvancar.addEventListener("click", () => {
            indiceDialogo++;

            if (indiceDialogo < dialogos.length) {
                mostrarDialogo(indiceDialogo);
            } else {
                audio.pause();
                flowery.style.display = "none";
                caixaDialogo.style.display = "none";
                btnAvancar.style.display = "none";
                vamosLa.style.display = "block";
            }
        });
    </script>

</body>
</html>
